<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion Admin · EM Poissonnerie</title>
<style>body{font:16px/1.5 Arial;background:#f3f6f7;color:#173846;display:grid;place-items:center;min-height:90vh}main{background:white;padding:32px;border-radius:18px;max-width:420px;width:80%;box-shadow:0 12px 40px #17384618}h1{font-size:24px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:10px 0;border:1px solid #aebfc6;border-radius:8px;font:inherit}button{background:#0d2f3d;color:white;cursor:pointer}p{color:#526b76}#status{min-height:24px}a{color:#0d2f3d}</style>
<main><h1>EM Poissonnerie · Admin</h1><p id="intro">Connectez-vous pour modifier le site.</p><form id="login"><label for="password">Mot de passe Admin</label><input type="password" id="password" autocomplete="current-password" required maxlength="256"><div id="confirmWrap" hidden><label for="confirmation">Confirmer le mot de passe</label><input type="password" id="confirmation" autocomplete="new-password" maxlength="256"></div><button id="submit">Se connecter</button></form><p id="status" role="status"></p><a href="/">Retour au site</a></main>
<script>
(async()=>{
const token=new URLSearchParams(location.hash.slice(1)).get('setup');
if(token){history.replaceState(null,'','/admin');document.getElementById('intro').textContent='Choisissez votre mot de passe Admin (12 caractères minimum). Il est enregistré sous forme chiffrée non réversible côté serveur.';document.getElementById('password').minLength=12;document.getElementById('password').autocomplete='new-password';document.getElementById('confirmWrap').hidden=false;document.getElementById('confirmation').required=true;document.getElementById('submit').textContent='Activer mon accès Admin'}
const info=await fetch('/api/admin/session',{cache:'no-store'}).then(r=>r.json());
if(info.authenticated&&!token){location.replace('/?admin=1');return}
if(!info.configured&&!token)document.getElementById('status').textContent='L’accès Admin doit être activé depuis le lien sécurisé fourni lors de la configuration.';
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const password=document.getElementById('password').value;if(token&&password!==document.getElementById('confirmation').value){document.getElementById('status').textContent='Les mots de passe ne correspondent pas.';return}const b=document.getElementById('submit');b.disabled=true;try{const r=await fetch(token?'/api/admin/setup':'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,token})});if(!r.ok)throw Error(r.status===429?'Trop de tentatives. Réessayez dans 15 minutes.':token?'Lien expiré ou accès déjà activé.':'Mot de passe incorrect.');location.replace('/?admin=1')}catch(err){document.getElementById('status').textContent=err.message;b.disabled=false}};
})();
</script></html>
